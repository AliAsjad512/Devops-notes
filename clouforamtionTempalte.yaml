Parameters:
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24
  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24
  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.3.0/24
  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.4.0/24
    Resources:
      VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: ThreeTierVPC }]
      
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref VPC, InternetGatewayId: !Ref InternetGateway }

    PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref VPC, CidrBlock: !Ref PublicSubnet1CIDR, AvailabilityZone: !Select [0, !GetAZs ''], MapPublicIpOnLaunch: true }
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref VPC, CidrBlock: !Ref PublicSubnet2CIDR, AvailabilityZone: !Select [1, !GetAZs ''], MapPublicIpOnLaunch: true }

    PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref VPC, CidrBlock: !Ref PrivateSubnet1CIDR, AvailabilityZone: !Select [0, !GetAZs ''] }
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref VPC, CidrBlock: !Ref PrivateSubnet2CIDR, AvailabilityZone: !Select [1, !GetAZs ''] }


    EIP1:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties: { AllocationId: !GetAtt EIP1.AllocationId, SubnetId: !Ref PublicSubnet1 }
  EIP2:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties: { AllocationId: !GetAtt EIP2.AllocationId, SubnetId: !Ref PublicSubnet2 }


    PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VPC }
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties: { RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }

    rivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VPC }
  PrivateRoute1:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRouteTable1, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatGateway1 }

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VPC }
  PrivateRoute2:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRouteTable2, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatGateway2 }
